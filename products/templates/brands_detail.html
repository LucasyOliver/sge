{% extends 'base.html' %}


{% block content %}

<div class="container mt-6">
  <h3 class="display-4">Detalhes da Marca</h3>

  <div class="card">
    <div class="card-body">
      <h3 class="title">{{ object.name }}</h3>
      <p class="card-text">{{ object.description }}</p>
    </div>
  </div>
  <a href="{% url 'brands_list' %}" class="btn btn-secondary mt-3">Cancelar e Voltar para lista de marcas</a>
</div>



{% endblock %}
