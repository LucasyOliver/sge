{% extends 'base.html' %}

{% block title %}
SGE - Marcas
{% endblock %}

{% block content %}

<div class="table-responsive">
	<table class="table table-striped table-bordered">
		<thead class="thead-dark">
			<tr>ID</tr>
			<tr>Nome</tr>
			<tr>Descrição</tr>
		</thead>
		<tbody>
			{% for category in categories %}
			<tr>
				<td>{{ category.id }}</td>
				<td>{{ category.name }}</td>
				<td>{{ category.description }}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>

</div>

{% endblock %}
