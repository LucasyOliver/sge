{% extends 'base.html' %}

{% block title %}
SGE - Saídas
{% endblock %}

{% block content %}

<div class="row mb-3">
	<div class="col-md-6">
		<form method="get" action="{% url 'outflows_list' %}">
			<div class="input-group">
				<input type="text" class="form-control" name="name" placeholder="Nome" value="{{ request.GET.name }}">
				<button type="submit" class="btn btn-primary">
					<i class="bi bi-search"></i>
				</button>
			</div>
		</form>
	</div>

	<div class="col-md-6">
		<a href="{% url 'outflows_create' %}" class=' btn btn-success float-end'>
			<i class="bi bi-plus"></i> Nova Saída
		</a>
	</div>
</div>

<div class="table-responsive">
	<table class="table table-striped table-bordered">
		<thead class="thead-dark">
			<tr>
				<th>ID</th>
				<th>Nome</th>
				<th>Descrição</th>
				<th>Ações</th>
			</tr>
		</thead>
		<tbody>
			{% for outflow in outflows %}
			<tr>
				<td>{{ outflow.id }}</td>
				<td>{{ outflow.name }}</td>
				<td>{{ outflow.description }}</td>
				<td class="text-nowrap" style="width: 1%;">
					<a href="{% url 'outflows_detail' supplier.id %}" class="btn btn-info btn-sm">
						<i class="bi bi-eye"></i>
					</a>

					<a href="{% url 'outflows_update' supplier.id %}" class="btn btn-warning btn-sm">
						<i class="bi bi-pencil"></i>
					</a>

					<a href="{% url 'outflows_delete' supplier.id %}" class="btn btn-danger btn-sm">
						<i class="bi bi-trash"></i>
					</a>
				</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
</div>

{% include 'components/_pagination.html' %}

{% endblock %}
