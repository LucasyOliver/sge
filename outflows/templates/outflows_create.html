{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">
	<h3 class="display-6">Cadastrar Saída</h3>

	<div class="card">
		<div class="card-body">
			<form method="post" class="form">
				{% csrf_token %}
				{{ form.as_p }}
				<button type="submit" class="btn btn-primary">Salvar Saída</button>
			</form>
		</div>
	</div>
	<a href="{% url 'outflows_list' %}" class="btn btn-secondary mt-3">Cancelar e voltar para de saídas</a>
</div>

{% endblock %}
